name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.2.app
    
    - name: Show Swift Version
      run: swift --version
    
    - name: Build
      run: swift build
    
    - name: Run Tests
      run: swift test
    
    - name: Build with Strict Concurrency (Swift 6 Readiness)
      run: swift build -Xswiftc -strict-concurrency=complete
      continue-on-error: false

  lint:
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check for Swift 6 Warnings
      run: |
        swift build 2>&1 | tee build.log
        if grep -q "warning:" build.log; then
          echo "Warnings found:"
          grep "warning:" build.log
          exit 1
        fi
        echo "No warnings found ✓"
