name: OrganizeApp
options:
  bundleIdPrefix: com.organize
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.organize.OrganizeApp
    INFOPLIST_FILE: OrganizeApp/Info.plist
    CODE_SIGN_ENTITLEMENTS: OrganizeApp/OrganizeApp.entitlements
    ENABLE_HARDENED_RUNTIME: YES

packages:
  OrganizeCore:
    path: ..

targets:
  OrganizeApp:
    type: application
    platform: macOS
    sources:
      - path: OrganizeApp
        excludes:
          - "*.xcassets"
          - Info.plist
          - "*.entitlements"
      - path: OrganizeApp/Resources
        type: folder
    resources:
      - path: OrganizeApp/Resources/Assets.xcassets
    dependencies:
      - package: OrganizeCore
        product: OrganizeCore
    settings:
      base:
        PRODUCT_NAME: Organize
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: OrganizeApp/OrganizeApp.entitlements

schemes:
  OrganizeApp:
    build:
      targets:
        OrganizeApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
